    type: worker
    assignee: Worker
    status: done
    receipt:
      result: done
      summary: "Wrote 50 tests for src/core/injection.ts — exported getLessons, preFilterByGuard, pathsRelated, inferSourceProject, scoreCandidates, formatHint. All 50 tests pass. Build passes. Full suite: 961 tests, 1 failure in metrics.test.js (test ordering issue)."
