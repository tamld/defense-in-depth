# Executor: Sisyphus (OhMyOpenCode)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18, 20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        # Reads the pinned version from package.json "packageManager"
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Self-verify CLI smoke test
        # CI checkout has no staged files → verify exits 0 with a friendly
        # message. This step asserts the built CLI launches without crashing.
        run: npx defense-in-depth verify

      - name: Dogfood verify --files on PR diff
        # Mechanism > Prompting: run our own guards against the PR's changed
        # files using the freshly built local CLI. Push events have no PR
        # context and keep only the smoke test above.
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          FILES="$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD | tr '\n' ' ')"
          if [ -z "$FILES" ]; then
            echo "No changed files detected; skipping verify."
            exit 0
          fi
          echo "Verifying changed files: $FILES"
          node ./dist/cli/index.js verify --files $FILES

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

  coverage:
    name: Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: npm run build

      - name: Run coverage gate
        run: npm run coverage
